name: FITYORA quality gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, lint, and production build
        run: npm run check

      - name: Run all regression tests
        run: node --test scripts/*.test.mjs

      - name: Run release preflight
        run: npm run audit:release

      - name: Package source after application checks
        run: |
          git archive --format=zip --prefix=FITYORATOPUP/ HEAD > FITYORATOPUP-CI-Checked-Source.zip
          test -s FITYORATOPUP-CI-Checked-Source.zip
          sha256sum FITYORATOPUP-CI-Checked-Source.zip

      - name: Upload source after application checks
        uses: actions/upload-artifact@v4
        with:
          name: FITYORATOPUP-CI-Checked-Source
          path: FITYORATOPUP-CI-Checked-Source.zip
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit full dependency tree
        run: npm audit --audit-level=low
